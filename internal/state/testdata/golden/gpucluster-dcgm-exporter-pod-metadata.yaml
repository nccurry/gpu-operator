apiVersion: v1
kind: ServiceAccount
metadata:
  name: nvidia-dcgm-exporter-dra
  namespace: test-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nvidia-dcgm-exporter-dra
  namespace: test-operator
rules:
- apiGroups:
  - resource.k8s.io
  resources:
  - resourceclaims
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app: nvidia-dcgm-exporter-dra
  name: nvidia-dcgm-exporter-dra-read-pods
rules:
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - resource.k8s.io
  resources:
  - resourceslices
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nvidia-dcgm-exporter-dra
  namespace: test-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nvidia-dcgm-exporter-dra
subjects:
- kind: ServiceAccount
  name: nvidia-dcgm-exporter-dra
  namespace: test-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app: nvidia-dcgm-exporter-dra
  name: nvidia-dcgm-exporter-dra-read-pods
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nvidia-dcgm-exporter-dra-read-pods
subjects:
- kind: ServiceAccount
  name: nvidia-dcgm-exporter-dra
  namespace: test-operator
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: nvidia-dcgm-exporter-admin
  namespace: test-operator
spec:
  spec:
    devices:
      requests:
      - exactly:
          adminAccess: true
          allocationMode: All
          deviceClassName: gpu.nvidia.com
        name: admin-gpus
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    prometheus.io/scrape: "true"
  labels:
    app: nvidia-dcgm-exporter-dra
    app.kubernetes.io/component: nvidia-dcgm-exporter
  name: nvidia-dcgm-exporter-dra
  namespace: test-operator
spec:
  ports:
  - name: gpu-metrics
    port: 9400
    protocol: TCP
    targetPort: 9400
  selector:
    app: nvidia-dcgm-exporter-dra
  type: ClusterIP
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app: nvidia-dcgm-exporter-dra
    app.kubernetes.io/component: nvidia-dcgm-exporter
  name: nvidia-dcgm-exporter-dra
  namespace: test-operator
spec:
  selector:
    matchLabels:
      app: nvidia-dcgm-exporter-dra
  template:
    metadata:
      annotations:
        nvidia.com/dcgm-exporter-config: |
          metrics:
          - enrichment:
              container: false
              dra: auto
              hpc_jobs: false
              kubernetes: auto
            every: 30s
            file: /etc/dcgm-exporter/default-counters.csv
            name: default
          outputs:
            prometheus:
              listen: :9400
              schema: dcgm/v1
              type: prometheus
          server:
            listen_health: :9401
          sources:
            dra:
              mode: kubernetes
            kubernetes:
              pod_labels:
                allow:
                - .*
                enabled: true
              pod_uid: false
          version: 2
      labels:
        app: nvidia-dcgm-exporter-dra
        app.kubernetes.io/component: nvidia-dcgm-exporter
    spec:
      automountServiceAccountToken: true
      containers:
      - env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: DCGM_EXPORTER_CONFIG_FILE
          value: /etc/dcgm-exporter/operator/config/dcgm-exporter.yaml
        image: nvcr.io/nvidia/k8s/dcgm-exporter:test
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          periodSeconds: 5
        name: nvidia-dcgm-exporter-dra
        ports:
        - containerPort: 9400
          name: metrics
        - containerPort: 9401
          name: health
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
        resources:
          claims:
          - name: admin-gpus
        securityContext:
          privileged: true
        startupProbe:
          failureThreshold: 60
          httpGet:
            path: /healthz
            port: health
          periodSeconds: 5
        volumeMounts:
        - mountPath: /etc/dcgm-exporter/operator/config
          name: dcgm-exporter-config
          readOnly: true
        - mountPath: /var/lib/kubelet/pod-resources
          name: pod-gpu-resources
          readOnly: true
      nodeSelector:
        nvidia.com/gpu.deploy.dcgm-exporter-dra: "true"
      priorityClassName: system-node-critical
      resourceClaims:
      - name: admin-gpus
        resourceClaimTemplateName: nvidia-dcgm-exporter-admin
      serviceAccountName: nvidia-dcgm-exporter-dra
      tolerations:
      - effect: NoSchedule
        key: nvidia.com/gpu
        operator: Exists
      volumes:
      - downwardAPI:
          items:
          - fieldRef:
              fieldPath: metadata.annotations['nvidia.com/dcgm-exporter-config']
            path: dcgm-exporter.yaml
        name: dcgm-exporter-config
      - hostPath:
          path: /var/lib/kubelet/pod-resources
        name: pod-gpu-resources
  updateStrategy:
    type: RollingUpdate
---
