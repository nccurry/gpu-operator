apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app: nvidia-dcgm-exporter
    app.kubernetes.io/component: nvidia-dcgm-exporter
  name: nvidia-dcgm-exporter
  namespace: "FILLED BY THE OPERATOR"
  annotations:
    openshift.io/scc: nvidia-dcgm-exporter
spec:
  selector:
    matchLabels:
      app: nvidia-dcgm-exporter
  template:
    metadata:
      labels:
        app: nvidia-dcgm-exporter
        app.kubernetes.io/component: nvidia-dcgm-exporter
      annotations: {}
    spec:
      nodeSelector:
        nvidia.com/gpu.deploy.dcgm-exporter: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      priorityClassName: system-node-critical
      serviceAccountName: nvidia-dcgm-exporter
      automountServiceAccountToken: false
      initContainers:
      - name: toolkit-validation
        image: "FILLED BY THE OPERATOR"
        command: ['sh', '-c']
        args: ["until [ -f /run/nvidia/validations/toolkit-ready ] && { grep -qsx live /sys/module/nvidia/initstate || [ -e /dev/dxg ]; }; do echo waiting for nvidia container stack to be setup; sleep 5; done"]
        securityContext:
          privileged: true
        volumeMounts:
          - name: run-nvidia
            mountPath: "/run/nvidia"
            mountPropagation: HostToContainer
      containers:
      - image: "FILLED BY THE OPERATOR"
        name: nvidia-dcgm-exporter
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        ports:
        - name: "metrics"
          containerPort: 9400
        - name: "health"
          containerPort: 9401
        startupProbe:
          httpGet:
            port: health
            path: /healthz
          periodSeconds: 5
          failureThreshold: 60
        livenessProbe:
          httpGet:
            port: health
            path: /healthz
          periodSeconds: 5
        readinessProbe:
          httpGet:
            port: health
            path: /readyz
        volumeMounts:
        - name: dcgm-exporter-config
          readOnly: true
          mountPath: /etc/dcgm-exporter/operator/config
        - name: "pod-gpu-resources"
          readOnly: true
          mountPath: "/var/lib/kubelet/pod-resources"
        securityContext:
          privileged: true
      volumes:
      - name: "pod-gpu-resources"
        hostPath:
          path: "/var/lib/kubelet/pod-resources"
      - name: run-nvidia
        hostPath:
          path: /run/nvidia
