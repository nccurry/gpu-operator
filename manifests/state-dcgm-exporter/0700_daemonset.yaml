apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-dcgm-exporter-dra
  namespace: {{ .Namespace }}
  labels:
    app: nvidia-dcgm-exporter-dra
    app.kubernetes.io/component: nvidia-dcgm-exporter
    {{- range $k, $v := .Daemonsets.Labels }}
    {{- if ne $k "app.kubernetes.io/component" }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
    {{- end }}
  {{- if .Daemonsets.Annotations }}
  annotations:
    {{- range $k, $v := .Daemonsets.Annotations }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
  {{- end }}
spec:
  selector:
    matchLabels:
      app: nvidia-dcgm-exporter-dra
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: nvidia-dcgm-exporter-dra
        app.kubernetes.io/component: nvidia-dcgm-exporter
        {{- range $k, $v := .Daemonsets.Labels }}
        {{- if and (ne $k "app") (ne $k "app.kubernetes.io/part-of") (ne $k "app.kubernetes.io/component") }}
        {{ $k }}: {{ $v | quote }}
        {{- end }}
        {{- end }}
      annotations:
        {{- range $k, $v := .PodAnnotations }}
        {{ $k }}: {{ $v | quote }}
        {{- end }}
    spec:
      priorityClassName: {{ .Daemonsets.PriorityClassName | default "system-node-critical" | quote }}
      serviceAccountName: nvidia-dcgm-exporter-dra
      automountServiceAccountToken: true
      # Gate scheduling on the per-component deploy label so the k8s-driver-manager
      # can pause it to drain dcgm-exporter off a node during a driver reload.
      nodeSelector:
        nvidia.com/gpu.deploy.dcgm-exporter-dra: "true"
      {{- if .DCGMExporter.Spec.ImagePullSecrets }}
      imagePullSecrets:
      {{- range .DCGMExporter.Spec.ImagePullSecrets }}
      - name: {{ . }}
      {{- end }}
      {{- end }}
      {{- if .HostPID }}
      hostPID: true
      {{- end }}
      {{- if .HostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      {{- if .Daemonsets.Tolerations }}
      tolerations:
      {{- range .Daemonsets.Tolerations }}
      - {{ . | toJson }}
      {{- end }}
      {{- end }}
      resourceClaims:
      - name: admin-gpus
        resourceClaimTemplateName: nvidia-dcgm-exporter-admin
      containers:
      - name: nvidia-dcgm-exporter-dra
        image: {{ .DCGMExporter.ImagePath }}
        {{- if .DCGMExporter.Spec.ImagePullPolicy }}
        imagePullPolicy: {{ .DCGMExporter.Spec.ImagePullPolicy }}
        {{- end }}
        {{- if .DCGMExporter.Spec.Args }}
        args:
        {{- range .DCGMExporter.Spec.Args }}
        - {{ . | quote }}
        {{- end }}
        {{- end }}
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        {{- range .DCGMExporter.Spec.Env }}
        - name: {{ .Name }}
          value: {{ .Value | quote }}
        {{- end }}
        - name: {{ .ConfigFileEnvName }}
          value: {{ .ConfigFilePath | quote }}
        securityContext:
          privileged: true
        ports: {{ .ContainerDefaults.Ports | toJson }}
        startupProbe: {{ .ContainerDefaults.StartupProbe | toJson }}
        livenessProbe: {{ .ContainerDefaults.LivenessProbe | toJson }}
        readinessProbe: {{ .ContainerDefaults.ReadinessProbe | toJson }}
        resources:
          {{- if .DCGMExporter.Spec.Resources }}
          {{- if .DCGMExporter.Spec.Resources.Limits }}
          limits: {{ .DCGMExporter.Spec.Resources.Limits | toJson }}
          {{- end }}
          {{- if .DCGMExporter.Spec.Resources.Requests }}
          requests: {{ .DCGMExporter.Spec.Resources.Requests | toJson }}
          {{- end }}
          {{- end }}
          claims:
          - name: admin-gpus
        volumeMounts:
        - name: {{ .ConfigVolumeName }}
          readOnly: true
          mountPath: {{ .ConfigFileDirectory }}
        - name: pod-gpu-resources
          readOnly: true
          mountPath: /var/lib/kubelet/pod-resources
        {{- if .MetricsConfigName }}
        - name: metrics-config
          readOnly: true
          mountPath: {{ .MetricsConfigMountDirectory }}
        {{- end }}
        {{- if .HPCJobMappingDir }}
        - name: hpc-job-mapping
          readOnly: true
          mountPath: {{ .HPCJobMappingDir }}
        {{- end }}
      volumes:
      - name: {{ .ConfigVolumeName }}
        downwardAPI:
          items:
          - fieldRef:
              fieldPath: {{ printf "metadata.annotations['%s']" .ConfigAnnotation | quote }}
            path: {{ .ConfigFileName }}
      - name: pod-gpu-resources
        hostPath:
          path: {{ .PodResourcesDir }}
      {{- if .MetricsConfigName }}
      - name: metrics-config
        configMap:
          name: {{ .MetricsConfigName }}
          items:
          - key: dcgm-metrics.csv
            path: dcgm-metrics.csv
      {{- end }}
      {{- if .HPCJobMappingDir }}
      - name: hpc-job-mapping
        hostPath:
          path: {{ .HPCJobMappingDir }}
          type: DirectoryOrCreate
      {{- end }}
